<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SARING DNS{% endblock %}</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Applied before first paint so switching to light mode never flashes
    // the dark default first - runs on every page (including /login,
    // since this <head> is shared) even though the toggle button itself
    // only appears in the logged-in nav.
    (function () {
      try {
        var saved = localStorage.getItem("saring-theme");
        if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
{% if request.session.get("user") %}
<nav class="nav">
  <div class="brand"><img src="/static/logo.png" alt="SARING" class="brand-logo"> <span>SARING <span class="muted">DNS</span></span></div>
  <a href="/" class="{{ 'active' if request.url.path == '/' }}">Dashboard</a>
  <a href="/settings" class="{{ 'active' if request.url.path == '/settings' }}">Pengaturan DNS</a>
  <a href="/logs" class="{{ 'active' if request.url.path == '/logs' }}">Log</a>
  <button type="button" id="theme-toggle" class="theme-toggle" title="Ganti tema terang/gelap" aria-label="Ganti tema terang/gelap">&#9728;&#65039;</button>
  <div class="nav-dropdown">
    <span class="nav-dropdown-trigger {{ 'active' if request.url.path == '/account' }}" tabindex="0">Akun Saya</span>
    <div class="nav-dropdown-menu">
      <a href="/account" class="{{ 'active' if request.url.path == '/account' }}">Akun Saya</a>
      <a href="/logout" class="logout">Keluar</a>
    </div>
  </div>
</nav>
{% endif %}
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer">Created By Kahfi. SARING DNS <a href="/changelog">Versi {{ app_version }}</a>.</footer>
<script>
  (function () {
    var STORAGE_KEY = "saring-theme";
    var root = document.documentElement;
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;

    function current() {
      return root.getAttribute("data-theme") === "light" ? "light" : "dark";
    }
    function applyIcon(theme) {
      btn.innerHTML = theme === "light" ? "&#127769;" : "&#9728;&#65039;";
    }

    applyIcon(current());
    btn.addEventListener("click", function () {
      var next = current() === "light" ? "dark" : "light";
      if (next === "light") {
        root.setAttribute("data-theme", "light");
      } else {
        root.removeAttribute("data-theme");
      }
      try { localStorage.setItem(STORAGE_KEY, next); } catch (e) {}
      applyIcon(next);
    });
  })();
</script>
</body>
</html>
