; Explicit journald size/age cap - installed by install.sh. Without this,
; systemd falls back to an implicit default (roughly 10% of the
; filesystem), which "Catat semua query DNS" (log_queries, see Pengaturan
; DNS) can hit within hours on a busy resolver - one client alone can log
; tens of thousands of query lines per 5-minute window. Once the journal
; hits either limit below, systemd auto-vacuums (deletes) its oldest
; entries to stay under it, so the disk itself is never at risk - this
; just makes the boundary an explicit, known number instead of an implicit
; percentage-of-disk default, and keeps other services' journal entries
; (dashboard, update, stats) from getting crowded out by query log volume
; sharing the same journal.
[Journal]
SystemMaxUse=3G
MaxRetentionSec=2day
