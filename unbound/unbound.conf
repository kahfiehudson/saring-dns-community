# Base Unbound config. install.sh appends the include line (and a
# remote-control block, if missing) to whatever /etc/unbound/unbound.conf
# already exists on the target host - this file is only a reference copy of
# what a from-scratch config should look like.
server:
    interface: 0.0.0.0
    interface: ::0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    username: "unbound"
    directory: "/etc/unbound"
    root-hints: "/var/lib/unbound/root.hints"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Everything below this line is dashboard-managed - do not hand-edit,
    # your changes will be overwritten on the next Settings save / reload.
    include: "/etc/unbound/trustpositif/conf.d/*.conf"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no
