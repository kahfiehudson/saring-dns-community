# Reference copy only - scripts/setup_nginx.sh generates and manages the
# live version at /etc/nginx/sites-available/trustpositif-dashboard, then
# lets certbot rewrite it in place to add the TLS server block + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME.example.id;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
